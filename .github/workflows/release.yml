name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - run: python tests/test_core.py
      - name: Build the .curapackage
        run: python tools/build_curapackage.py dist
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v$(python -c 'import json;print(json.load(open("SharkSupport/plugin.json"))["version"])')-wip" ;; esac
          cd dist && sha256sum * > SHA256SUMS.txt && cd ..
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --prerelease --title "Shark Support $TAG (work in progress)" \
              --notes "WORK IN PROGRESS: MANY FEATURES MAY BE BROKEN. Drag the .curapackage onto Cura, or unzip the source and double-click Install-Linux.sh / Install-Windows.bat / Install-Mac.command. See CHANGELOG.md."
          fi
